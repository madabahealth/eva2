<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام تقييم أداء الموظفين</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
            user-drag: none !important;
        }

        input[type="text"], input[type="password"], input[type="number"] {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            width: 400px;
            max-width: 90%;
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            text-align: center;
        }
        .logo {
            max-width: 110px;
            margin-bottom: 20px;
            pointer-events: none;
        }
        .login-title {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .login-subtitle {
            font-size: 1.2em;
            color: #3498db;
            margin-bottom: 30px;
            font-weight: 600;
        }
        h1 {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1em;
            font-weight: bold;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1.1em;
            text-align: center;
            box-sizing: border-box;
        }
        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 0.9em;
            display: none;
        }
        .login-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="logo.png" alt="شعار مديرية صحة مادبا" class="logo">
        <h2 class="login-title">المملكة الأردنية الهاشمية</h2>
        <h3 class="login-subtitle">مديرية صحة محافظة مادبا</h3>
        <h1>نظام تقييم أداء الموظفين</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="employeeId">الرقم الوظيفي:</label>
                <input type="text" id="employeeId" name="employeeId" required placeholder="أدخل رقمك الوظيفي" autocomplete="off">
            </div>
            <div id="errorMessage" class="error-message">الرقم الوظيفي غير صحيح، يرجى المحاولة مرة أخرى</div>
            <button type="submit" class="login-btn">دخول</button>
        </form>
    </div>

    <!-- كود الحماية - مفصول تماماً عن كود العمل -->
    <script>
    (function(){
        // 1. إلغاء الزر الأيمن
        document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; });

        // 2. حظر اختصارات لوحة المفاتيح
        document.addEventListener('keydown', function(e){
            if(e.key === 'F12' || e.keyCode === 123){ e.preventDefault(); return false; }
            if(e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c','K','k','M','m'].indexOf(e.key) !== -1){ e.preventDefault(); return false; }
            if(e.ctrlKey && ['U','u','S','s','P','p'].indexOf(e.key) !== -1){ e.preventDefault(); return false; }
            if(e.ctrlKey && e.key === 'A' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); return false; }
            if(e.ctrlKey && e.key === 'a' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); return false; }
            if(e.key === 'PrintScreen'){ e.preventDefault(); document.body.style.filter='blur(50px)'; setTimeout(function(){ document.body.style.filter='none'; },100); return false; }
            // ماك
            if(e.metaKey && e.altKey && ['I','i','U','u','J','j','C','c'].indexOf(e.key) !== -1){ e.preventDefault(); return false; }
        });

        // 3. منع السحب
        document.addEventListener('dragstart', function(e){ e.preventDefault(); return false; });
        document.addEventListener('drop', function(e){ e.preventDefault(); return false; });

        // 4. منع النسخ والقص خارج الحقول
        document.addEventListener('copy', function(e){ if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); } });
        document.addEventListener('cut', function(e){ if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); } });

        // 5. منع الطباعة
        window.addEventListener('beforeprint', function(){ document.body.style.display='none'; });
        window.addEventListener('afterprint', function(){ document.body.style.display='flex'; });

        // 6. تنظيف Console
        setInterval(function(){ console.clear(); }, 300);

        // 7. كشف DevTools
        var devOpen = false;
        setInterval(function(){
            var w = window.outerWidth - window.innerWidth > 160;
            var h = window.outerHeight - window.innerHeight > 160;
            if(w || h){
                if(!devOpen){ devOpen = true; document.body.innerHTML = ''; document.head.innerHTML = ''; try{ window.location.replace('about:blank'); }catch(ex){} }
            } else { devOpen = false; }
        }, 500);

        // 8. منع view-source
        if(window.location.protocol === 'view-source:'){ window.location.href = 'about:blank'; }

        // 9. حماية الصور
        document.querySelectorAll('img').forEach(function(img){ img.setAttribute('draggable','false'); });

        // 10. منع dblclick تحديد
        document.addEventListener('dblclick', function(e){ if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); } });
    })();
    </script>
